
name: Build Iraqi Studio AI

on:
  workflow_dispatch:
  push:
    paths:
      - 'IraqiStudioAI-source.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: unzip -q IraqiStudioAI-source.zip

      - name: Upload extracted source for inspection
        uses: actions/upload-artifact@v4
        with:
          name: IraqiStudioAI-extracted-source
          path: IraqiStudioAI/
          if-no-files-found: error
          retention-days: 3

      - name: Fix Java and Kotlin JVM targets
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("IraqiStudioAI/app/build.gradle.kts")
          s = p.read_text()

          needle = "    buildFeatures { compose = true }"

          replacement = """    compileOptions {
              sourceCompatibility = JavaVersion.VERSION_17
              targetCompatibility = JavaVersion.VERSION_17
          }

          kotlinOptions {
              jvmTarget = "17"
          }

          buildFeatures { compose = true }"""

          if needle not in s:
              raise SystemExit("Could not find expected buildFeatures line")

          p.write_text(s.replace(needle, replacement, 1))
          print("Java and Kotlin targets set to 17")
          PY

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: IraqiStudioAI
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Iraqi-Studio-AI-APK
          path: IraqiStudioAI/app/build/outputs/apk/debug/app-debug.apk

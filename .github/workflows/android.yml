name: Build Iraqi Studio AI
# Rebuild the current editor UI commit after source-only updates.

on:
  workflow_dispatch:
  push:
    paths:
      - 'IraqiStudioAI-source.zip'
      - '.github/workflows/android.yml'
      - '.github/source-overrides/**'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: unzip -q IraqiStudioAI-source.zip

      - name: Download and verify on-device segmentation model
        working-directory: IraqiStudioAI
        run: |
          mkdir -p app/src/main/assets
          curl -fL --retry 3 "https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_multiclass_256x256/float32/1/selfie_multiclass_256x256.tflite" -o app/src/main/assets/selfie_multiclass.tflite
          echo "c6748b1253a99067ef71f7e26ca71096cd449baefa8f101900ea23016507e0e0  app/src/main/assets/selfie_multiclass.tflite" | sha256sum -c -
          curl -fL --retry 3 "https://github.com/mlcommons/mobile_models/raw/9c7b31ce63ff0331bd659ac2609c4e68b6b4ec0f/v0_7/tflite/deeplabv3_mnv2_ade20k_float.tflite" -o app/src/main/assets/deeplabv3_ade20k.tflite
          echo "Downloaded alternate ADE20K model:"
          stat -c "size=%s bytes" app/src/main/assets/deeplabv3_ade20k.tflite
          od -An -tx1 -N8 app/src/main/assets/deeplabv3_ade20k.tflite
          sha256sum app/src/main/assets/deeplabv3_ade20k.tflite
          echo "12a2141f28928a9bccce5063d0f868211c9d2633a263b9141594ff300daeafc0  app/src/main/assets/deeplabv3_ade20k.tflite" | sha256sum -c -
          test "$(dd if=app/src/main/assets/deeplabv3_ade20k.tflite bs=1 skip=4 count=4 2>/dev/null | od -An -tx1 | tr -d ' \n')" = "54464c33"
          test "$(stat -c%s app/src/main/assets/deeplabv3_ade20k.tflite)" -gt 5000000

      - name: Set up Python for TFLite validation
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Inspect and smoke-test ADE20K model tensors
        working-directory: IraqiStudioAI
        run: |
          python -m pip install --quiet 'numpy<2' pillow tflite-runtime==2.14.0
          mkdir -p app/src/androidTest/assets
          curl -fL --retry 3 https://raw.githubusercontent.com/onnx/tensorflow-onnx/main/tests/beach.jpg -o app/src/androidTest/assets/ade20k_sky_test.jpg
          python - <<'PY'
          import numpy as np
          from tflite_runtime.interpreter import Interpreter
          model = "app/src/main/assets/deeplabv3_ade20k.tflite"
          interpreter = Interpreter(model_path=model, num_threads=2)
          interpreter.allocate_tensors()
          inp = interpreter.get_input_details()[0]
          out = interpreter.get_output_details()[0]
          print("INPUT:", inp["shape"].tolist(), inp["dtype"].__name__, inp["name"])
          print("OUTPUT:", out["shape"].tolist(), out["dtype"].__name__, out["name"])
          assert inp["shape"].tolist() == [1, 512, 512, 3], "Unexpected model input shape"
          assert inp["dtype"] == np.float32, "Unexpected model input dtype"
          sample = np.zeros(inp["shape"], dtype=np.float32)
          sample[:, :, :, 0] = 90.0 / 255.0
          sample[:, :, :, 1] = 140.0 / 255.0
          sample[:, :, :, 2] = 210.0 / 255.0
          interpreter.set_tensor(inp["index"], sample)
          interpreter.invoke()
          result = interpreter.get_tensor(out["index"])
          print("INFERENCE OUTPUT:", result.shape, result.dtype, "classes:", np.unique(result)[:20])
          assert out["shape"].tolist() == [1, 512, 512], "Unexpected segmentation output shape"
          assert out["dtype"] == np.int32, "Unexpected segmentation output type"
          assert result.shape == (1, 512, 512), "Unexpected inference output"
          assert int(result.min()) >= 0 and int(result.max()) < 150, "ADE20K class ids out of range"
          from PIL import Image
          scene = np.asarray(Image.open("app/src/androidTest/assets/ade20k_sky_test.jpg").convert("RGB").resize((512, 512)), dtype=np.float32)[None, ...] / 255.0
          interpreter.set_tensor(inp["index"], scene)
          interpreter.invoke()
          scene_result = interpreter.get_tensor(out["index"])[0]
          unique, counts = np.unique(scene_result, return_counts=True)
          class_counts = dict(zip(unique.tolist(), counts.tolist()))
          sky_pixels = int(class_counts.get(2, 0))
          print("ADE20K BEACH IMAGE CLASS COUNTS:", class_counts)
          print("SKY PIXELS:", sky_pixels)
          assert sky_pixels > 1000, "Model did not detect sky in the known beach test image"
          PY

      - name: Prepare a short H264 clip for end-to-end export validation
        working-directory: IraqiStudioAI
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -y -loop 1 -framerate 2 -i app/src/androidTest/assets/ade20k_sky_test.jpg -t 1.5 \
            -vf "scale=320:320:force_original_aspect_ratio=decrease,pad=320:320:(ow-iw)/2:(oh-ih)/2" \
            -r 2 -c:v libx264 -preset ultrafast -pix_fmt yuv420p -movflags +faststart -an \
            app/src/androidTest/assets/semantic_export_test.mp4
          test -s app/src/androidTest/assets/semantic_export_test.mp4

      - name: Apply updated editor source
        run: |
          cp .github/source-overrides/app/src/main/java/com/iraqistudio/ai/MainActivity.kt IraqiStudioAI/app/src/main/java/com/iraqistudio/ai/MainActivity.kt
          cp .github/source-overrides/app/src/main/java/com/iraqistudio/ai/SegmentationEngine.kt IraqiStudioAI/app/src/main/java/com/iraqistudio/ai/SegmentationEngine.kt
          cp .github/source-overrides/app/src/main/java/com/iraqistudio/ai/SkySegmentationEngine.kt IraqiStudioAI/app/src/main/java/com/iraqistudio/ai/SkySegmentationEngine.kt
          cp .github/source-overrides/app/src/main/java/com/iraqistudio/ai/VideoPortraitEngine.kt IraqiStudioAI/app/src/main/java/com/iraqistudio/ai/VideoPortraitEngine.kt
          cp .github/source-overrides/app/src/main/java/com/iraqistudio/ai/VideoEffectsEngine.kt IraqiStudioAI/app/src/main/java/com/iraqistudio/ai/VideoEffectsEngine.kt
          cp .github/source-overrides/app/src/main/java/com/iraqistudio/ai/VideoRegionColorEngine.kt IraqiStudioAI/app/src/main/java/com/iraqistudio/ai/VideoRegionColorEngine.kt
          cp .github/source-overrides/app/src/main/java/com/iraqistudio/ai/SemanticVideoRegionEffect.kt IraqiStudioAI/app/src/main/java/com/iraqistudio/ai/SemanticVideoRegionEffect.kt
          cp .github/source-overrides/app/src/main/java/com/iraqistudio/ai/VideoColorStudioPanel.kt IraqiStudioAI/app/src/main/java/com/iraqistudio/ai/VideoColorStudioPanel.kt
          cp .github/source-overrides/app/build.gradle.kts IraqiStudioAI/app/build.gradle.kts
          cp .github/source-overrides/app/src/main/res/values/styles.xml IraqiStudioAI/app/src/main/res/values/styles.xml
          mkdir -p IraqiStudioAI/app/src/main/res/drawable
          cp .github/source-overrides/app/src/main/res/drawable/ic_iraqi_studio_brand.xml IraqiStudioAI/app/src/main/res/drawable/ic_iraqi_studio_brand.xml
          python3 - <<'PY'
          from pathlib import Path
          import re
          manifest = Path('IraqiStudioAI/app/src/main/AndroidManifest.xml')
          if not manifest.exists():
              raise SystemExit('AndroidManifest.xml not found')
          data = manifest.read_text()
          start = data.find('<application')
          end = data.find('>', start)
          if start < 0 or end < 0:
              raise SystemExit('Application manifest tag not found')
          tag = data[start:end + 1]
          for attr in ('icon', 'roundIcon'):
              pattern = rf'android:{attr}="[^"]*"'
              replacement = f'android:{attr}="@drawable/ic_iraqi_studio_brand"'
              if re.search(pattern, tag):
                  tag = re.sub(pattern, replacement, tag, count=1)
              elif attr == 'icon':
                  tag = tag[:-1] + ' android:icon="@drawable/ic_iraqi_studio_brand">'
          data = data[:start] + tag + data[end + 1:]
          manifest.write_text(data)
          print('Applied black Iraqi Studio AI launcher icon')
          PY
          mkdir -p IraqiStudioAI/app/src/androidTest/java/com/iraqistudio/ai
          cp .github/source-overrides/app/src/androidTest/java/com/iraqistudio/ai/SkySegmentationInstrumentedTest.kt IraqiStudioAI/app/src/androidTest/java/com/iraqistudio/ai/SkySegmentationInstrumentedTest.kt
          cp .github/source-overrides/app/src/androidTest/java/com/iraqistudio/ai/VideoPortraitEngineInstrumentedTest.kt IraqiStudioAI/app/src/androidTest/java/com/iraqistudio/ai/VideoPortraitEngineInstrumentedTest.kt
          cp .github/source-overrides/app/src/androidTest/java/com/iraqistudio/ai/VideoRegionColorEngineInstrumentedTest.kt IraqiStudioAI/app/src/androidTest/java/com/iraqistudio/ai/VideoRegionColorEngineInstrumentedTest.kt
          cp .github/source-overrides/app/src/androidTest/java/com/iraqistudio/ai/SemanticVideoExportInstrumentedTest.kt IraqiStudioAI/app/src/androidTest/java/com/iraqistudio/ai/SemanticVideoExportInstrumentedTest.kt
          mkdir -p IraqiStudioAI/app/src/test/java/com/iraqistudio/ai
          cp .github/source-overrides/app/src/test/java/com/iraqistudio/ai/VideoRegionColorEngineTest.kt IraqiStudioAI/app/src/test/java/com/iraqistudio/ai/VideoRegionColorEngineTest.kt

      - name: Upload prepared source for inspection
        uses: actions/upload-artifact@v4
        with:
          name: IraqiStudioAI-v0.6-source
          path: IraqiStudioAI/
          if-no-files-found: error
          retention-days: 3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        id: build_apk
        working-directory: IraqiStudioAI
        run: gradle assembleDebug

      - name: Upload APK
        if: steps.build_apk.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Iraqi-Studio-AI-APK-v0.10.0
          path: IraqiStudioAI/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Run video region segmentation tests on Android 10 emulator
        continue-on-error: false
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_I_WANT_MY_TCG: 'yes'
        with:
          api-level: 29
          target: default
          profile: pixel_2
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 4096 -cores 2
          script: cd IraqiStudioAI && timeout 25m gradle connectedDebugAndroidTest --no-daemon --stacktrace


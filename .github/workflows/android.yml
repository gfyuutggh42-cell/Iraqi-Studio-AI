name: Build Iraqi Studio AI

on:
  workflow_dispatch:
  push:
    paths:
      - 'IraqiStudioAI-source.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: unzip -q IraqiStudioAI-source.zip

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: IraqiStudioAI
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Iraqi-Studio-AI-APK
          path: IraqiStudioAI/app/build/outputs/apk/debug/app-debug.apk
